<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Nexus | Cognitive Decay Tracker</title>

    <!-- Fonts: Orbitron for headers, Rajdhani for technical text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            /* Neural Nexus Palette */
            --void-bg: #050508;
            --glass-panel: rgba(10, 10, 15, 0.65);
            --neon-cyan: #00f3ff;
            --neon-magenta: #bc13fe;
            --neon-green: #0aff0a;
            --neon-alert: #ff2a2a;
            --holo-border: rgba(0, 243, 255, 0.3);
            --text-primary: #e0faff;
            --text-dim: #5c677d;

            --glow-low: 0 0 10px rgba(0, 243, 255, 0.2);
            --glow-high: 0 0 20px rgba(188, 19, 254, 0.4);
        }

        body {
            background-color: var(--void-bg);
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            letter-spacing: 0.03em;
        }

        /* Canvas Background */
        #neural-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.8;
        }

        /* Typography */
        h1,
        h2,
        h3,
        h4,
        h5,
        .cyber-font {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Holographic Panels */
        .holo-glass {
            background: var(--glass-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--holo-border);
            border-radius: 4px;
            /* Techy corners */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .holo-glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0.7;
        }

        .holo-glass:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
            transform: translateY(-2px);
        }

        /* Glitch Text Effect for Main Title */
        .glitch-text {
            position: relative;
            color: var(--text-primary);
        }

        /* Stats Badges */
        .cyber-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            padding: 4px 12px;
            border: 1px solid currentColor;
            background: rgba(0, 0, 0, 0.3);
            letter-spacing: 0.1em;
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
        }

        .cyber-badge.cyan {
            color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .cyber-badge.magenta {
            color: var(--neon-magenta);
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.2);
        }

        .cyber-badge.green {
            color: var(--neon-green);
            box-shadow: 0 0 10px rgba(10, 255, 10, 0.2);
        }

        .cyber-badge.red {
            color: var(--neon-alert);
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.2);
        }

        /* Skill Node Cards */
        .node-card {
            height: 100%;
            padding: 1.5rem;
            position: relative;
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.8rem;
        }

        .node-icon {
            font-size: 2rem;
            color: var(--neon-cyan);
            filter: drop-shadow(0 0 5px var(--neon-cyan));
        }

        .decay-meter-container {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            margin: 1.5rem 0;
            position: relative;
        }

        .decay-meter-fill {
            height: 100%;
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            width: 0%;
            transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Buttons */
        .btn-cyber {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 0.8rem 2rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            z-index: 1;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }

        .btn-cyber::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--neon-cyan);
            z-index: -1;
            transform: translateX(-100%);
            transition: transform 0.3s;
        }

        .btn-cyber:hover {
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .btn-cyber:hover::before {
            transform: translateX(0);
        }

        .btn-icon-cyber {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            clip-path: polygon(30% 0, 100% 0, 100% 70%, 70% 100%, 0 100%, 0 30%);
        }

        .btn-icon-cyber:hover {
            border-color: var(--neon-magenta);
            color: var(--neon-magenta);
            box-shadow: 0 0 15px var(--neon-magenta);
        }

        /* Scanlines Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.1) 50%, rgba(0, 0, 0, 0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            opacity: 0.3;
        }

        /* Modals */
        .modal-content {
            background-color: #0a0a0f;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
        }

        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--text-dim);
            color: var(--text-primary);
            border-radius: 0;
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(0, 243, 255, 0.05);
            border-color: var(--neon-cyan);
            color: var(--text-primary);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        /* Loading */
        .loader-ring {
            width: 64px;
            height: 64px;
            border: 4px solid transparent;
            border-top: 4px solid var(--neon-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <canvas id="neural-canvas"></canvas>
    <div class="scanlines"></div>
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" style="z-index: 2000"></div>

    <div class="container py-5">
        <!-- Header -->
        <header class="row align-items-end mb-5 border-bottom border-dark pb-4"
            style="border-color: rgba(255,255,255,0.1) !important;">
            <div class="col-lg-8">
                <div class="d-flex align-items-center gap-3 mb-2">
                    <span class="cyber-badge green">SYSTEM_ONLINE</span>
                    <span class="cyber-badge cyan">NET_V2.4</span>
                </div>
                <h1 class="display-3 fw-bold mb-0 glitch-text"
                    style="color:white; text-shadow: 0 0 20px rgba(0,255,255,0.5);">
                    NEURAL<span style="color: var(--neon-magenta)">NEXUS</span>
                </h1>
                <p class="text-dim mt-2" style="font-family: 'Rajdhani'; font-size: 1.2rem; letter-spacing: 2px;">
                    COGNITIVE DECAY INTELLIGENCE INTERFACE
                </p>
            </div>
            <div class="col-lg-4 text-lg-end">
                <button class="btn-cyber" data-bs-toggle="modal" data-bs-target="#addSkillModal">
                    <ion-icon name="add-circle-outline" class="me-2"></ion-icon>INIT_NEW_NODE
                </button>
            </div>
        </header>

        <!-- Main Dashboard -->
        <div class="row g-4 mb-5">
            <!-- Stats Column -->
            <div class="col-lg-3">
                <div class="holo-glass p-4 mb-4 text-center">
                    <div class="text-dim cyber-font small mb-2">NETWORK SUSTAINABILITY</div>
                    <div class="display-4 fw-bold"
                        style="color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan);" id="avgRetention">--%
                    </div>
                    <div id="retentionStatus" class="mt-2 text-uppercase small">CALCULATING...</div>
                </div>

                <div class="holo-glass p-4 text-center">
                    <div class="text-dim cyber-font small mb-2">ACTIVE NODES</div>
                    <div class="display-4 fw-bold text-white" id="totalSkills">0</div>
                </div>
            </div>

            <!-- Chart Column -->
            <div class="col-lg-9">
                <div class="holo-glass p-4 h-100 d-flex align-items-center justify-content-between">
                    <div class="w-100" style="max-width: 300px;">
                        <h4 class="cyber-font mb-4 text-white">SYSTEM INTEGRITY</h4>
                        <div class="d-flex flex-column gap-3" id="healthLegend">
                            <!-- JS populated -->
                        </div>
                    </div>
                    <div style="height: 250px; width: 250px; position: relative;">
                        <canvas id="mainHealthChart"></canvas>
                        <div class="position-absolute top-50 start-50 translate-middle text-center">
                            <div style="font-size: 0.6rem; color: var(--text-dim);" class="cyber-font">STATUS</div>
                            <div class="h3 mb-0 cyber-font" id="overallStatusText" style="color: var(--neon-cyan)">--
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Skills Matrix -->
        <div class="row g-4">
            <div class="col-12 mb-2">
                <h4 class="cyber-font d-flex align-items-center"
                    style="color: var(--text-primary); border-left: 4px solid var(--neon-magenta); padding-left: 1rem;">
                    ACTIVE_NEURAL_PATHWAYS
                </h4>
            </div>

            <div id="skillsContainer" class="row g-4">
                <div class="col-12 text-center py-5">
                    <div class="loader-ring mx-auto"></div>
                    <p class="mt-3 text-dim cyber-font">INITIALIZING_DATA_STREAM...</p>
                </div>
            </div>
        </div>

        <!-- Activity Log (Simplified for cleaner look) -->
        <div class="mt-5 pt-4 border-top" style="border-color: rgba(255,255,255,0.05) !important;">
            <h5 class="cyber-font text-dim mb-4">SYSTEM_LOGS</h5>
            <div id="historyContainer" class="row g-3"
                style="max-height: 200px; overflow-y: auto; scrollbar-width: thin;">
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="addSkillModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title cyber-font text-white">>> INIT_NEW_NODE</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="addSkillForm">
                    <div class="modal-body">
                        <div class="mb-4">
                            <label class="form-label text-dim small cyber-font">IDENTIFIER</label>
                            <input type="text" id="skillName" class="form-control" placeholder="e.g. QUANTUM_MECHANICS"
                                required>
                        </div>
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label text-dim small cyber-font">CONFIDENCE_INDEX</label>
                                <input type="number" id="confidenceScore" class="form-control" min="0" max="100"
                                    value="80">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-dim small cyber-font">PERFORMANCE_METRIC</label>
                                <input type="number" id="actualScore" class="form-control" min="0" max="100" value="75">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top border-secondary">
                        <button type="submit" class="btn-cyber w-100">EXECUTE</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="practiceModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title cyber-font text-white">>> PROTOCOL_REINFORCEMENT</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="practiceForm">
                    <input type="hidden" id="practiceSkillId">
                    <div class="modal-body">
                        <div class="mb-4">
                            <label class="form-label text-dim small cyber-font">ACTIVITY_VECTOR</label>
                            <select id="activityType" class="form-select">
                                <option value="Project Implementation">PRACTICAL_APPLICATION</option>
                                <option value="Tutorial / Reading">DATA_INGESTION</option>
                                <option value="Quiz / Assessment">PERFORMANCE_CHECK</option>
                                <option value="Mentoring Others">KNOWLEDGE_TRANSFER</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label text-dim small cyber-font">SESSION_LOG</label>
                            <textarea id="practiceNotes" class="form-control" rows="3"
                                placeholder="Input session details..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-top border-secondary">
                        <button type="submit" class="btn-cyber w-100">UPDATE_MATRICES</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- Neural Background Animation ---
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2 + 1;
                this.color = Math.random() > 0.5 ? '#00f3ff' : '#bc13fe';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Draw connections
            particles.forEach((p, i) => {
                p.update();
                p.draw();

                // Connect near particles
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(100, 100, 255, ${0.15 - dist / 1000})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        // --- Logic Integration ---
        let healthChart = null;

        document.addEventListener('DOMContentLoaded', fetchAll);

        // Toast System
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = 'toast show align-items-center text-white border-0';
            el.style.backgroundColor = type === 'success' ? 'rgba(10, 255, 10, 0.2)' : 'rgba(0, 243, 255, 0.2)';
            el.style.backdropFilter = 'blur(10px)';
            el.style.border = `1px solid ${type === 'success' ? 'var(--neon-green)' : 'var(--neon-cyan)'}`;

            el.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body cyber-font small">
                        ${type === 'success' ? '[SUCCESS]' : '[INFO]'} ${msg}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            container.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        async function fetchAll() {
            try {
                const [skills, interventions, history] = await Promise.all([
                    fetch('/skills').then(r => r.json()),
                    fetch('/intervention').then(r => r.json()),
                    fetch('/history').then(r => r.json())
                ]);
                updateStats(skills);
                renderSkills(skills, interventions);
                updateChart(skills);
                renderHistory(history);
            } catch (e) {
                console.error(e);
                showToast('CONNECTION_LOST: RETRYING...', 'error');
            }
        }

        function updateStats(skills) {
            document.getElementById('totalSkills').textContent = skills.length;
            if (skills.length > 0) {
                const avg = Math.round(skills.reduce((a, b) => a + b.proficiency_score, 0) / skills.length);
                document.getElementById('avgRetention').textContent = avg + '%';

                const statusEl = document.getElementById('retentionStatus');
                statusEl.innerHTML = avg > 80 ? '<span class="text-success">OPTIMAL_FLOW</span>' : '<span class="text-warning">SIGNAL_DEGRADATION</span>';

                document.getElementById('overallStatusText').textContent = avg > 70 ? 'STABLE' : 'RISK';
            }
        }

        function renderSkills(skills, interventions) {
            const container = document.getElementById('skillsContainer');
            container.innerHTML = '';

            if (skills.length === 0) {
                container.innerHTML = `<div class="text-center text-dim cyber-font py-5">NO_DATA_NODES_FOUND</div>`;
                return;
            }

            skills.forEach((skill, i) => {
                const zone = skill.stability_zone || 'stable';
                let colorVar = 'var(--neon-green)';
                if (zone === 'drift') colorVar = 'var(--neon-cyan)'; // Using Cyan for drift/warn in this theme usually
                if (zone === 'critical') colorVar = 'var(--neon-alert)';

                const html = `
                <div class="col-xl-4 col-md-6">
                    <div class="holo-glass node-card p-4">
                        <div class="node-header">
                            <div>
                                <h4 class="mb-1 text-white" style="font-size: 1.1rem">${skill.skill_name}</h4>
                                <div class="cyber-badge" style="color: ${colorVar}; border-color: ${colorVar}">${zone.toUpperCase()}</div>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn-icon-cyber" onclick="openPracticeModal(${skill.id})" title="REINFORCE">
                                    <ion-icon name="flash"></ion-icon>
                                </button>
                                <button class="btn-icon-cyber" onclick="simulateDecay(${skill.id})" title="ACCELERATE_DECAY">
                                    <ion-icon name="hourglass"></ion-icon>
                                </button>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <small class="text-dim cyber-font" style="font-size: 0.6rem">SKILL_DEBT</small>
                                <div class="h5 mb-0 text-white">${skill.skill_debt}</div>
                            </div>
                            <div class="col-6">
                                <small class="text-dim cyber-font" style="font-size: 0.6rem">FAIL_PROB</small>
                                <div class="h5 mb-0" style="color: ${skill.failure_probability > 0.5 ? 'var(--neon-alert)' : 'var(--text-primary)'}">
                                    ${(skill.failure_probability * 100).toFixed(0)}%
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between text-dim small mb-1 cyber-font">
                            <span>SIGNAL_STRENGTH</span>
                            <span style="color: ${colorVar}">${skill.proficiency_score}%</span>
                        </div>
                        <div class="progress" style="height: 4px; background: rgba(255,255,255,0.1);">
                            <div class="progress-bar" style="width: ${skill.proficiency_score}%; background: ${colorVar}; box-shadow: 0 0 10px ${colorVar}"></div>
                        </div>

                        <div class="mt-3 pt-3 border-top border-secondary" style="border-color: rgba(255,255,255,0.1) !important">
                             <div class="text-dim small cyber-font mb-1">> INTELLIGENCE_SUGGESTION</div>
                             <div class="text-white small" style="font-style: italic; opacity: 0.8">
                                "${skill.explainability.corrective_action}"
                             </div>
                        </div>
                    </div>
                </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function renderHistory(history) {
            const container = document.getElementById('historyContainer');
            container.innerHTML = history.slice(0, 8).map(log => `
                <div class="col-md-6 col-lg-3">
                    <div class="p-2 border border-secondary" style="border-color: rgba(255,255,255,0.1) !important; background: rgba(0,0,0,0.2)">
                        <div class="d-flex justify-content-between">
                            <span class="text-white small cyber-font">${log.skill_name}</span>
                            <span class="text-dim small" style="font-size: 0.7rem">${new Date(log.date).toLocaleDateString()}</span>
                        </div>
                        <div class="text-info small" style="font-size: 0.75rem">${log.activity_type}</div>
                    </div>
                </div>
            `).join('');
        }

        function updateChart(skills) {
            const ctx = document.getElementById('mainHealthChart').getContext('2d');
            if (healthChart) healthChart.destroy();

            const data = [
                skills.filter(s => s.stability_zone === 'stable').length,
                skills.filter(s => s.stability_zone === 'drift').length,
                skills.filter(s => s.stability_zone === 'critical').length
            ];

            healthChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: data,
                        backgroundColor: ['#0aff0a', '#00f3ff', '#ff2a2a'],
                        borderWidth: 0,
                    }]
                },
                options: {
                    cutout: '85%',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        // --- Interaction Handlers ---
        document.getElementById('addSkillForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                skill_name: document.getElementById('skillName').value,
                confidence_score: document.getElementById('confidenceScore').value,
                actual_score: document.getElementById('actualScore').value
            };
            await fetch('/add-skill', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            bootstrap.Modal.getInstance(document.getElementById('addSkillModal')).hide();
            showToast('NODE_INITIALIZED', 'success');
            fetchAll();
        };

        window.openPracticeModal = (id) => {
            document.getElementById('practiceSkillId').value = id;
            new bootstrap.Modal(document.getElementById('practiceModal')).show();
        };

        document.getElementById('practiceForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                skill_id: document.getElementById('practiceSkillId').value,
                activity_type: document.getElementById('activityType').value,
                notes: document.getElementById('practiceNotes').value
            };
            await fetch('/practice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            bootstrap.Modal.getInstance(document.getElementById('practiceModal')).hide();
            showToast('MATRICES_UPDATED', 'success');
            fetchAll();
        };

        window.simulateDecay = async (id) => {
            await fetch(`/simulate-decay/${id}`, { method: 'POST' });
            showToast('TEMPORAL_SHIFT_COMPLETE', 'info');
            fetchAll();
        };
    </script>
</body>

</html>
